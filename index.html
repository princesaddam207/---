<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অষ্টগ্রাম ই-সেবা</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F4EE;--card:#fff;--ink:#1B2B25;--mut:#4A5A53;--pri:#0F5F4A;--onpri:#fff;--acc:#E8A33D;--line:#C9D3CE;--tint:#DDEBE4;--err:#9A2B1B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201A;--card:#1A2F27;--ink:#EAF1EC;--mut:#A9BAB1;--pri:#2E8F72;--line:#335147;--tint:#244339;--err:#FF9C8A}}
:root[data-theme="dark"]{--bg:#10201A;--card:#1A2F27;--ink:#EAF1EC;--mut:#A9BAB1;--pri:#2E8F72;--line:#335147;--tint:#244339;--err:#FF9C8A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--pri);color:var(--onpri);padding:24px 20px 20px}
.hero{background:linear-gradient(135deg,#0B4A39,#177A5C);padding:28px 20px 36px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:14px}.hero h1{font-size:28px}.hero svg{flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
.top{display:flex;align-items:center;gap:8px}
.back{background:transparent;border:0;color:inherit;font:600 16px inherit;min-height:44px;min-width:44px;cursor:pointer;padding:0 8px 0 0}
main{flex:1;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;cursor:pointer;color:var(--ink);font:600 14px inherit}
.ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.tile{box-shadow:inset 0 3px 0 var(--c)}.tile .ic{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.note{background:var(--tint);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mut);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;min-height:40px;padding:0 14px;font:600 14px inherit;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:16px inherit;background:var(--card);color:var(--ink)}
textarea{min-height:96px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;min-height:48px;padding:0 18px;font:600 15px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.acc{background:var(--acc);color:#1B2B25;width:100%;margin:8px 0 14px}
.btn.sm{min-height:44px}
.item{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.item h3{margin:0;font-size:16px}
.item .m{font-size:13px;color:var(--mut);margin-top:2px}
.item p{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
.act{display:flex;gap:8px;margin-top:10px}
.del{background:transparent;border:1px solid var(--line);color:var(--err);border-radius:12px;min-height:44px;padding:0 14px;font:600 14px inherit;cursor:pointer}
.sec{font-size:16px;margin:18px 0 10px;color:var(--ink)}.empty{text-align:center;color:var(--mut);padding:32px 12px}
.err{color:var(--err);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<header id="hd"></header>
<main id="mn"></main>
</div>

var a=ld(k);a.unshift(e);sv(k,a);mod(k)}};
